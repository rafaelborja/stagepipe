name: CI

# Tests on every supported Python and OS, and measures memory and time on each.
# Also called by publish.yml, so a release cannot go out unless this passes.
# Python 3.15 is not here yet: it joins the matrix when GitHub's runners offer it (see the roadmap).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Tag or branch to test
        type: string
        default: ""

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (stress, memory, features)
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python tests/stress.py
          python tests/memory_test.py
          python tests/features_test.py
          python tests/close_test.py
      - name: Footprint (memory and time)
        shell: bash
        run: |
          python -m pip install psutil
          mkdir -p reports
          python bench/footprint.py
          python bench/footprint.py --json > "reports/${{ matrix.os }}-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: footprint-${{ matrix.os }}-${{ matrix.python }}
          path: reports/

  report:
    name: footprint report
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: footprint-*
          path: reports
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge into one table
        run: python bench/report.py reports/*.json | tee -a "$GITHUB_STEP_SUMMARY"
