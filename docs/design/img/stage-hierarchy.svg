<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 516" width="980" height="516" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Option A: one Stage class with keywords. Option B, decided: a base Stage class with Transient and Permanent subclasses."><title>Stage design options</title><rect width="980" height="516" rx="12" fill="#ffffff" stroke="#d1d5db"/><text xml:space="preserve" x="24" y="34" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Decision 1: how should a stage declare what kind of work it does?</text><text xml:space="preserve" x="24" y="56" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Decided: Option B with two kinds. Nothing is implemented. Memory cost is the same: classes exist once per stage, never per item.</text><rect x="24" y="76" width="440" height="420" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="40" y="104" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">Option A: one class, keywords (not chosen)</text><rect x="40" y="122" width="408" height="140" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="52" y="146" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Stage(name, fn, workers=3,</text><text xml:space="preserve" x="52" y="164" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      effect="permanent",   # transient | permanent</text><text xml:space="preserve" x="52" y="182" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      save=True, retries=0,</text><text xml:space="preserve" x="52" y="200" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      recover=lambda ctx: ...)</text><text xml:space="preserve" x="40" y="290" font-size="12" font-weight="600" fill="#111827" text-anchor="start">The runner decides what each value of effect= means:</text><text xml:space="preserve" x="40" y="312" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">if effect == "permanent": never retry; markers; ...</text><text xml:space="preserve" x="40" y="329" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">else: retry, redo, drop freely; ...</text><text xml:space="preserve" x="40" y="346" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">(one switch, in the runner)</text><text xml:space="preserve" x="40" y="378" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Good</text><text xml:space="preserve" x="40" y="398" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Smallest API: one name to learn</text><text xml:space="preserve" x="40" y="415" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Nothing new to import</text><text xml:space="preserve" x="40" y="436" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Costly</text><text xml:space="preserve" x="40" y="456" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Behaviour lives in one switch; users cannot add a kind</text><rect x="500" y="76" width="456" height="420" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="516" y="104" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">Option B: base class + a subclass per kind (chosen)</text><text xml:space="preserve" x="516" y="124" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">behaviour lives ON the classes (retry, resume, stop, validate)</text><rect x="618" y="138" width="220" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text xml:space="preserve" x="728" y="158" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Stage</text><text xml:space="preserve" x="728" y="176" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">undeclared = today's behaviour</text><text xml:space="preserve" x="728" y="193" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">no retries or checkpoint allowed</text><line x1="728" y1="208" x2="620" y2="238" stroke="#9ca3af" stroke-width="1.5"/><rect x="524" y="238" width="192" height="124" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="620" y="259" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Transient</text><text xml:space="preserve" x="534" y="283" font-size="11" font-weight="400" fill="#111827" text-anchor="start">leaves no trace</text><text xml:space="preserve" x="534" y="301" font-size="11" font-weight="400" fill="#111827" text-anchor="start">retry, redo, drop: yes</text><text xml:space="preserve" x="534" y="319" font-size="11" font-weight="400" fill="#111827" text-anchor="start">scratch=True: own files</text><text xml:space="preserve" x="534" y="337" font-size="11" font-weight="400" fill="#111827" text-anchor="start">cleaned up for you</text><line x1="728" y1="208" x2="836" y2="238" stroke="#9ca3af" stroke-width="1.5"/><rect x="740" y="238" width="192" height="124" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="836" y="259" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">Permanent</text><text xml:space="preserve" x="750" y="283" font-size="11" font-weight="400" fill="#111827" text-anchor="start">leaves a lasting change</text><text xml:space="preserve" x="750" y="301" font-size="11" font-weight="400" fill="#111827" text-anchor="start">never repeated on its own</text><text xml:space="preserve" x="750" y="319" font-size="11" font-weight="400" fill="#111827" text-anchor="start">markers: .start .done</text><text xml:space="preserve" x="750" y="337" font-size="11" font-weight="400" fill="#111827" text-anchor="start">idempotent=True or recover=</text><text xml:space="preserve" x="516" y="396" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Good</text><text xml:space="preserve" x="516" y="414" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Each kind owns and tests its own rules</text><text xml:space="preserve" x="516" y="430" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Users can subclass for their own kind</text><text xml:space="preserve" x="516" y="446" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Plain Stage keeps working unchanged</text><text xml:space="preserve" x="750" y="396" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Costly</text><text xml:space="preserve" x="750" y="414" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Two more public names</text><text xml:space="preserve" x="750" y="430" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Kind is fixed by inheritance</text><text xml:space="preserve" x="516" y="480" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">Rule: does it leave a permanent trace? If yes, Permanent.</text></svg>