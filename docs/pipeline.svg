<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" width="960" height="424" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Timeline comparison: stage by stage versus stagepipe"><title>Stage by stage versus stagepipe</title><rect width="960" height="424" rx="10" fill="#ffffff" stroke="#e5e7eb"/><text x="28" y="30" font-size="15" font-weight="700" fill="#4b5563" text-anchor="start">Stage by stage: every stage waits for the slowest item of the previous one</text><text x="28" y="74.5" font-size="13" font-weight="600" fill="#374151" text-anchor="start">render</text><rect x="102" y="48" width="830" height="45" rx="3" fill="#f3f4f6"/><rect x="102.0" y="49" width="57.8" height="13" rx="2" fill="#2563eb"/><rect x="102.0" y="64" width="57.8" height="13" rx="2" fill="#16a34a"/><rect x="102.0" y="79" width="57.8" height="13" rx="2" fill="#d97706"/><rect x="161.3" y="49" width="57.8" height="13" rx="2" fill="#db2777"/><rect x="161.3" y="64" width="57.8" height="13" rx="2" fill="#7c3aed"/><rect x="161.3" y="79" width="57.8" height="13" rx="2" fill="#0891b2"/><text x="28" y="125.5" font-size="13" font-weight="600" fill="#374151" text-anchor="start">ocr</text><rect x="102" y="99" width="830" height="45" rx="3" fill="#f3f4f6"/><rect x="220.6" y="100" width="176.4" height="13" rx="2" fill="#2563eb"/><rect x="220.6" y="115" width="176.4" height="13" rx="2" fill="#16a34a"/><rect x="220.6" y="130" width="176.4" height="13" rx="2" fill="#d97706"/><rect x="398.4" y="100" width="176.4" height="13" rx="2" fill="#db2777"/><rect x="398.4" y="115" width="176.4" height="13" rx="2" fill="#7c3aed"/><rect x="398.4" y="130" width="176.4" height="13" rx="2" fill="#0891b2"/><text x="28" y="161.5" font-size="13" font-weight="600" fill="#374151" text-anchor="start">save</text><rect x="102" y="150" width="830" height="15" rx="3" fill="#f3f4f6"/><rect x="576.3" y="151" width="57.8" height="13" rx="2" fill="#2563eb"/><rect x="635.6" y="151" width="57.8" height="13" rx="2" fill="#16a34a"/><rect x="694.9" y="151" width="57.8" height="13" rx="2" fill="#d97706"/><rect x="754.1" y="151" width="57.8" height="13" rx="2" fill="#db2777"/><rect x="813.4" y="151" width="57.8" height="13" rx="2" fill="#7c3aed"/><rect x="872.7" y="151" width="57.8" height="13" rx="2" fill="#0891b2"/><line x1="635.6" y1="167" x2="635.6" y2="179" stroke="#111827" stroke-width="1.5"/><text x="641.5714285714286" y="177" font-size="12" font-weight="600" fill="#111827" text-anchor="start">first result</text><text x="932.0" y="177" font-size="12" font-weight="400" fill="#4b5563" text-anchor="end">done at t=14</text><text x="28" y="225" font-size="15" font-weight="700" fill="#111827" text-anchor="start">stagepipe: an item moves on as soon as the next stage has a free worker</text><text x="28" y="269.5" font-size="13" font-weight="600" fill="#374151" text-anchor="start">render</text><rect x="102" y="243" width="830" height="45" rx="3" fill="#f3f4f6"/><rect x="102.0" y="244" width="57.8" height="13" rx="2" fill="#2563eb"/><rect x="102.0" y="259" width="57.8" height="13" rx="2" fill="#16a34a"/><rect x="102.0" y="274" width="57.8" height="13" rx="2" fill="#d97706"/><rect x="161.3" y="244" width="57.8" height="13" rx="2" fill="#db2777"/><rect x="161.3" y="259" width="57.8" height="13" rx="2" fill="#7c3aed"/><rect x="161.3" y="274" width="57.8" height="13" rx="2" fill="#0891b2"/><text x="28" y="320.5" font-size="13" font-weight="600" fill="#374151" text-anchor="start">ocr</text><rect x="102" y="294" width="830" height="45" rx="3" fill="#f3f4f6"/><rect x="161.3" y="295" width="176.4" height="13" rx="2" fill="#2563eb"/><rect x="161.3" y="310" width="176.4" height="13" rx="2" fill="#16a34a"/><rect x="161.3" y="325" width="176.4" height="13" rx="2" fill="#d97706"/><rect x="339.1" y="295" width="176.4" height="13" rx="2" fill="#db2777"/><rect x="339.1" y="310" width="176.4" height="13" rx="2" fill="#7c3aed"/><rect x="339.1" y="325" width="176.4" height="13" rx