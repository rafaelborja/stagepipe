<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 522" width="980" height="522" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Five example items at the moment a stop is requested, and what each stop mode does with them."><title>What happens to in-flight items at a graceful stop</title><rect width="980" height="522" rx="12" fill="#ffffff" stroke="#d1d5db"/><text xml:space="preserve" x="24" y="34" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Decision 3: what happens to items already in the pipeline when a stop is requested</text><text xml:space="preserve" x="24" y="56" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Example pipeline: read (Pure, not saved) -&gt; upload (Target, an effect, not saved) -&gt; save (Pure, saved). A stop arrives at this moment:</text><rect x="24" y="76" width="260" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Item, at the moment of the stop</text><rect x="284" y="76" width="220" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="292" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">No drain  (drain=False)</text><rect x="504" y="76" width="240" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="512" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Automatic  (drain=None)</text><rect x="744" y="76" width="224" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="752" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Drain everything  (drain=True)</text><rect x="24" y="116" width="260" height="56" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="139" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">1  waiting for read</text><text xml:space="preserve" x="32" y="157" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">nothing started, no effect yet</text><rect x="284" y="116" width="220" height="56" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="394.0" y="149" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">dropped, redone later</text><rect x="504" y="116" width="240" height="56" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="624.0" y="149" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">dropped, redone later</text><rect x="744" y="116" width="224" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="856.0" y="149" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">runs to the end</text><rect x="24" y="178" width="260" height="56" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="201" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">2  read is running</text><text xml:space="preserve" x="32" y="219" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">no effect yet</text><rect x="284" y="178" width="220" height="56" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="394.0" y="211" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">call ends, then dropped</text><rect x="504" y="178" width="240" height="56" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="624.0" y="211" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">call ends, then dropped</text><rect x="744" y="178" width="224" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="856.0" y="211" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">runs to the end</text><rect x="24" y="240" width="260" height="56" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="263" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">3  waiting for upload</text><text xml:space="preserve" x="32" y="281" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">read done, value only in memory</text><rect x="284" y="240" width="220" height="56" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="394.0" y="273" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">dropped, redone later</text><rect x="504" y="240" width="240" height="56" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="624.0" y="273" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">dropped, redone later</text><rect x="744" y="240" width="224" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="856.0" y="273" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">uploads, then saves</text><rect x="24" y="302" width="260" height="56" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="325" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">4  upload is running</text><text xml:space="preserve" x="32" y="343" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">the effect is happening</text><rect x="284" y="302" width="220" height="56" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="394.0" y="326" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">call ends, marker written,</text><text xml:space="preserve" x="394.0" y="343" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">dropped</text><rect x="504" y="302" width="240" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="624.0" y="335" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">call ends, goes on to save</text><rect x="744" y="302" width="224" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="856.0" y="335" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">call ends, goes on to save</text><rect x="24" y="364" width="260" height="56" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="387" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">5  waiting for save</text><text xml:space="preserve" x="32" y="405" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">upload done, result only in memory</text><rect x="284" y="364" width="220" height="56" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="394.0" y="388" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">dropped; recover= decides</text><text xml:space="preserve" x="394.0" y="405" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">on restart</text><rect x="504" y="364" width="240" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="624.0" y="397" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">goes on to save</text><rect x="744" y="364" width="224" height="56" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="856.0" y="397" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">goes on to save</text><text xml:space="preserve" x="24" y="440" font-size="12" font-weight="600" fill="#111827" text-anchor="start">Key: green = keeps going.  Red = dropped (not an error: nothing is written, the item is redone on the next run).  Amber = depends on a marker or recover=.</text><text xml:space="preserve" x="24" y="462" font-size="12" font-weight="600" fill="#4b5563" text-anchor="start">Automatic rule: if an effect already happened and its result exists only in memory, the item keeps going until its data is saved.</text><text xml:space="preserve" x="24" y="482" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Otherwise it is dropped at the next stage boundary. A call that is already running always finishes. Dropped items write nothing.</text><text xml:space="preserve" x="24" y="502" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Drain everything also starts the upload for items 1 to 3: that is what you ask for with drain=True. Automatic never starts a new effect.</text></svg>