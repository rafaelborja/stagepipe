<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 448" width="980" height="448" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A grid of stage kinds against retry, re-run on resume, skip on resume, behaviour at a stop, and what the user must provide."><title>What the library may do, by kind of stage</title><rect width="980" height="448" rx="12" fill="#ffffff" stroke="#d1d5db"/><text xml:space="preserve" x="24" y="34" font-size="17" font-weight="700" fill="#111827" text-anchor="start">What the library may do automatically, by kind of stage</text><text xml:space="preserve" x="24" y="56" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Proposed. Green: yes. Amber: only under a condition. Red: never (the user must handle it).</text><rect x="24" y="76" width="210" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Kind of stage</text><rect x="234" y="76" width="130" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="242" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Retry in a run</text><rect x="364" y="76" width="150" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="372" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Re-run on resume</text><rect x="514" y="76" width="150" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="522" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Skip on resume</text><rect x="664" y="76" width="170" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="672" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">At a graceful stop</text><rect x="834" y="76" width="114" height="34" rx="4" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="842" y="98" font-size="12" font-weight="700" fill="#111827" text-anchor="start">You must provide</text><rect x="24" y="116" width="210" height="50" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="137" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Stage (undeclared)</text><text xml:space="preserve" x="32" y="154" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">today's behaviour</text><rect x="234" y="116" width="130" height="50" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="299.0" y="146" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">not allowed</text><rect x="364" y="116" width="150" height="50" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="439.0" y="146" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">not allowed</text><rect x="514" y="116" width="150" height="50" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="589.0" y="146" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">not allowed</text><rect x="664" y="116" width="170" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="749.0" y="146" font-size="11.5" font-weight="600" fill="#4b5563" text-anchor="middle">finish in flight</text><rect x="834" y="116" width="114" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="891.0" y="146" font-size="11.5" font-weight="600" fill="#4b5563" text-anchor="middle">declare a kind</text><rect x="24" y="172" width="210" height="50" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="193" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Transient</text><text xml:space="preserve" x="32" y="210" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">reads, parses, OCR: no trace</text><rect x="234" y="172" width="130" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="299.0" y="202" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><rect x="364" y="172" width="150" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="439.0" y="202" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><rect x="514" y="172" width="150" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="589.0" y="202" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">if output saved</text><rect x="664" y="172" width="170" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="749.0" y="202" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">dropped, recomputed</text><rect x="834" y="172" width="114" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="891.0" y="202" font-size="11.5" font-weight="600" fill="#4b5563" text-anchor="middle">nothing</text><rect x="24" y="228" width="210" height="50" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="249" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Transient, scratch=True</text><text xml:space="preserve" x="32" y="266" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">private working files</text><rect x="234" y="228" width="130" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="299.0" y="258" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes, overwrite</text><rect x="364" y="228" width="150" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="439.0" y="258" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><rect x="514" y="228" width="150" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="589.0" y="258" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">if output saved</text><rect x="664" y="228" width="170" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="749.0" y="258" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">dropped, recomputed</text><rect x="834" y="228" width="114" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="891.0" y="258" font-size="11.5" font-weight="600" fill="#4b5563" text-anchor="middle">nothing (cleanup)</text><rect x="24" y="284" width="210" height="50" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="305" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Permanent, idempotent=True</text><text xml:space="preserve" x="32" y="322" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">atomic write, upsert</text><rect x="234" y="284" width="130" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="299.0" y="314" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><rect x="364" y="284" width="150" height="50" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="439.0" y="314" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">yes</text><rect x="514" y="284" width="150" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="589.0" y="314" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">if .done marker</text><rect x="664" y="284" width="170" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="749.0" y="314" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">finishes the call</text><rect x="834" y="284" width="114" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="891.0" y="314" font-size="11.5" font-weight="600" fill="#4b5563" text-anchor="middle">the promise</text><rect x="24" y="340" width="210" height="50" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="32" y="361" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Permanent</text><text xml:space="preserve" x="32" y="378" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">delete, send, bill, append</text><rect x="234" y="340" width="130" height="50" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="299.0" y="370" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">never</text><rect x="364" y="340" width="150" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="439.0" y="370" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">only via recover=</text><rect x="514" y="340" width="150" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="589.0" y="370" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">if .done or recover says so</text><rect x="664" y="340" width="170" height="50" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="749.0" y="370" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="middle">finishes the call</text><rect x="834" y="340" width="114" height="50" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="891.0" y="370" font-size="11.5" font-weight="600" fill="#4b5563" text-anchor="middle">recover=</text><text xml:space="preserve" x="24" y="410" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Retry is a separate opt-in (retries=N), off by default. Skipping a stage needs its output saved, or recover= must supply a value.</text><text xml:space="preserve" x="24" y="430" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">A Permanent stage must be first or follow a saved stage (its input must still exist on a restart), unless recover= says otherwise.</text></svg>