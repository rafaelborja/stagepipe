<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Option A: one Stage class with keywords. Option B: a base Stage class with Pure, Scratch, Target and Destructive subclasses."><title>Stage design options</title><rect width="980" height="590" rx="12" fill="#ffffff" stroke="#d1d5db"/><text xml:space="preserve" x="24" y="34" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Decision 1: how should a stage declare what kind of work it does?</text><text xml:space="preserve" x="24" y="56" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Proposed designs only. Nothing is implemented. Memory cost is the same: classes exist once per stage, never per item.</text><rect x="24" y="76" width="440" height="492" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="40" y="104" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="start">Option A: one class, keywords</text><rect x="40" y="122" width="408" height="164" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="52" y="146" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Stage(name, fn, workers=3,</text><text xml:space="preserve" x="52" y="164" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      effect="destructive",   # pure | scratch | target | destructive</text><text xml:space="preserve" x="52" y="182" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      save=True, retries=0,</text><text xml:space="preserve" x="52" y="200" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      idempotent=False,</text><text xml:space="preserve" x="52" y="218" font-size="12" font-weight="400" fill="#111827" text-anchor="start">      recover=lambda ctx: ...)</text><text xml:space="preserve" x="40" y="312" font-size="12" font-weight="600" fill="#111827" text-anchor="start">The runner decides what each value of effect= means:</text><text xml:space="preserve" x="40" y="334" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">if effect == "destructive": never retry; markers; ...</text><text xml:space="preserve" x="40" y="351" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">elif effect == "target": retry only if idempotent; ...</text><text xml:space="preserve" x="40" y="368" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">elif ...   (one switch, in the runner)</text><text xml:space="preserve" x="40" y="406" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Good</text><text xml:space="preserve" x="40" y="426" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Smallest API: one name to learn</text><text xml:space="preserve" x="40" y="443" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Nothing new to import</text><text xml:space="preserve" x="40" y="472" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Costly</text><text xml:space="preserve" x="40" y="492" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Behaviour for every kind lives in one big switch</text><text xml:space="preserve" x="40" y="509" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Users cannot define their own kind</text><text xml:space="preserve" x="40" y="526" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Validation rules are scattered</text><rect x="500" y="76" width="456" height="492" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="516" y="104" font-size="15" font-weight="700" fill="#15803d" text-anchor="start">Option B: base class + a subclass per kind</text><text xml:space="preserve" x="516" y="124" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">behaviour lives ON the classes (retry, resume, stop, validate)</text><rect x="618" y="138" width="220" height="70" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text xml:space="preserve" x="728" y="158" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Stage</text><text xml:space="preserve" x="728" y="176" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">undeclared = today's behaviour</text><text xml:space="preserve" x="728" y="193" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="middle">no retries or checkpoint allowed</text><line x1="728" y1="208" x2="580" y2="238" stroke="#9ca3af" stroke-width="1.5"/><rect x="512" y="238" width="136" height="112" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="580" y="259" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Pure</text><text xml:space="preserve" x="520" y="281" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">retry: yes</text><text xml:space="preserve" x="520" y="298" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">re-run on resume: yes</text><text xml:space="preserve" x="520" y="315" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">dropped at a stop: yes</text><line x1="728" y1="208" x2="728" y2="238" stroke="#9ca3af" stroke-width="1.5"/><rect x="660" y="238" width="136" height="112" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="728" y="259" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">Target</text><text xml:space="preserve" x="668" y="281" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">retry: only if idempotent</text><text xml:space="preserve" x="668" y="298" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">marker: .done</text><text xml:space="preserve" x="668" y="315" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">finishes at a stop</text><line x1="728" y1="208" x2="876" y2="238" stroke="#9ca3af" stroke-width="1.5"/><rect x="808" y="238" width="136" height="112" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="876" y="259" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">Destructive</text><text xml:space="preserve" x="816" y="281" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">retry: never</text><text xml:space="preserve" x="816" y="298" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">markers: .start .done</text><text xml:space="preserve" x="816" y="315" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">needs recover= or done=</text><line x1="580" y1="350" x2="580" y2="372" stroke="#9ca3af" stroke-width="1.5"/><rect x="512" y="372" width="136" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="580" y="392" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Scratch</text><text xml:space="preserve" x="520" y="410" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">+ per-item scratch path</text><text xml:space="preserve" x="520" y="425" font-size="10.5" font-weight="400" fill="#111827" text-anchor="start">+ cleaned up for you</text><text xml:space="preserve" x="516" y="460" font-size="13" font-weight="700" fill="#15803d" text-anchor="start">Good</text><text xml:space="preserve" x="516" y="478" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Each kind owns and tests its own rules</text><text xml:space="preserve" x="516" y="494" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Users can subclass for their own kind</text><text xml:space="preserve" x="516" y="510" font-size="12" font-weight="400" fill="#111827" text-anchor="start">+ Plain Stage keeps working unchanged</text><text xml:space="preserve" x="750" y="460" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="start">Costly</text><text xml:space="preserve" x="750" y="478" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Four more public names</text><text xml:space="preserve" x="750" y="494" font-size="12" font-weight="400" fill="#111827" text-anchor="start">- Kind is fixed by inheritance</text><text xml:space="preserve" x="516" y="550" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">Leaning: Option B. The kinds differ in behaviour, not in data, and plain Stage stays safe.</text></svg>