<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 504" width="980" height="504" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="An urgent item never waits behind lower levels in a queue. A running call is only preempted if its stage is Transient and the stage allows it; Permanent and undeclared stages are never interrupted."><title>Urgent items and running calls</title><rect width="980" height="504" rx="12" fill="#ffffff" stroke="#d1d5db"/><text xml:space="preserve" x="24" y="34" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Proposal: what an URGENT item can do to work that is already running</text><text xml:space="preserve" x="24" y="56" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">A Python thread cannot be killed. 'Preempt' means: abandon the call, discard its result, put the item back. Nothing is built.</text><rect x="24" y="78" width="250" height="30" rx="4" fill="#111827" stroke="#111827" stroke-width="1.2"/><text xml:space="preserve" x="34" y="98" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Stage kind of the running call</text><rect x="274" y="78" width="330" height="30" rx="4" fill="#111827" stroke="#111827" stroke-width="1.2"/><text xml:space="preserve" x="284" y="98" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">What URGENT does</text><rect x="604" y="78" width="352" height="30" rx="4" fill="#111827" stroke="#111827" stroke-width="1.2"/><text xml:space="preserve" x="614" y="98" font-size="12" font-weight="700" fill="#ffffff" text-anchor="start">Why / cost</text><rect x="24" y="116" width="250" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="34" y="142" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Transient</text><text xml:space="preserve" x="34" y="160" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">leaves no trace</text><rect x="274" y="116" width="330" height="62" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="284" y="138" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">Preempts it: the call is abandoned, the item</text><text xml:space="preserve" x="284" y="153" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">goes back to its lane and is redone</text><rect x="604" y="116" width="352" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="614" y="136" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">Safe to repeat. Costs a leaked thread until it</text><text xml:space="preserve" x="614" y="150" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">returns (same machinery as the deadline work, #17).</text><text xml:space="preserve" x="614" y="164" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">Counts one loss for the item.</text><rect x="24" y="184" width="250" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="34" y="210" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Permanent</text><text xml:space="preserve" x="34" y="228" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">a lasting change</text><rect x="274" y="184" width="330" height="62" rx="4" fill="#fee2e2" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="284" y="206" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="start">Never preempted. URGENT takes the next free</text><text xml:space="preserve" x="284" y="221" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="start">worker</text><rect x="604" y="184" width="352" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="614" y="204" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">Interrupting could leave a half-done effect. The</text><text xml:space="preserve" x="614" y="218" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">wait is at most one call.</text><rect x="24" y="252" width="250" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="34" y="278" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Plain Stage</text><text xml:space="preserve" x="34" y="296" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">undeclared</text><rect x="274" y="252" width="330" height="62" rx="4" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="284" y="274" font-size="11.5" font-weight="600" fill="#b45309" text-anchor="start">Never preempted, treated like Permanent</text><rect x="604" y="252" width="352" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="614" y="272" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">We do not know that it is safe to repeat, so we</text><text xml:space="preserve" x="614" y="286" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">assume it is not.</text><rect x="24" y="320" width="250" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="34" y="346" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Not started yet</text><text xml:space="preserve" x="34" y="364" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">waiting in a queue</text><rect x="274" y="320" width="330" height="62" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="284" y="342" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">Goes to the front of the queue, ahead of</text><text xml:space="preserve" x="284" y="357" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="start">every other level</text><rect x="604" y="320" width="352" height="62" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="614" y="340" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">Costs nothing. Items it overtakes each count one</text><text xml:space="preserve" x="614" y="354" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">loss.</text><rect x="24" y="394" width="932" height="92" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="40" y="418" font-size="12" font-weight="400" fill="#111827" text-anchor="start">No reserved slots and the window does not grow. A full window gives URGENT the place of the lowest-level item that has not started a call.</text><text xml:space="preserve" x="40" y="438" font-size="12" font-weight="400" fill="#111827" text-anchor="start">No endless losing: an item that has lost its place max_bypass times can no longer be overtaken or preempted. It runs next.</text><text xml:space="preserve" x="40" y="458" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Checkpoints still hold: a preempted item writes nothing and is redone, a saved result is never discarded.</text></svg>