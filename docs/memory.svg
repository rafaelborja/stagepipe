<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Memory: stagepipe adds 0.2 MB to a bare Python process; version 0.1.0 import costs 0.03 MB against 2.07 MB for 0.0.3"><title>Memory footprint of stagepipe</title><rect width="960" height="384" rx="10" fill="#ffffff" stroke="#e5e7eb"/><text x="28" y="34" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Memory of the whole process after pushing 2,000 items of 20 KB through two stages</text><text x="28" y="54" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">CPython 3.12, Windows. Resident memory, a fresh process each. Bars start at zero.</text><text x="28" y="85" font-size="13" font-weight="600" fill="#374151" text-anchor="start">Python alone</text><rect x="178.0" y="68" width="524.2" height="24" rx="3" fill="#9ca3af"/><text x="712.16" y="85" font-size="13" font-weight="600" fill="#374151" text-anchor="start">16.8 MB</text><text x="28" y="121" font-size="13" font-weight="600" fill="#374151" text-anchor="start">with stagepipe 0.1.0</text><rect x="178.0" y="104" width="524.2" height="24" rx="3" fill="#9ca3af"/><rect x="702.2" y="104" width="6.2" height="24" rx="2" fill="#2563eb"/><text x="718.4" y="121" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start">17.0 MB   (+0.2 MB)</text><text x="178" y="146" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">stagepipe stays small because it does little: threads, a queue and a bounded window of items.</text><line x1="28" y1="174" x2="932" y2="174" stroke="#e5e7eb" stroke-width="1"/><text x="28" y="200" font-size="15" font-weight="700" fill="#111827" text-anchor="start">What stagepipe adds to a bare Python process, before and after 0.1.0</text><text x="28" y="222" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">CI, Windows, Python 3.12 (growth in resident memory over a bare process). Lower is better.</text><text x="28" y="258" font-size="13" font-weight="600" fill="#374151" text-anchor="start">import stagepipe</text><rect x="178.0" y="242" width="492.5" height="20" rx="3" fill="#dc2626"/><text x="680.4549278846154" y="257" font-size="12" font-weight="600" fill="#dc2626" text-anchor="start">0.0.3: 2.02 MB</text><rect x="178.0" y="268" width="7.6" height="20" rx="3" fill="#2563eb"/><text x="195.62019230769232" y="283" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">0.1.0: 0.03 MB</text><text x="28" y="322" font-size="13" font-weight="600" fill="#374151" text-anchor="start">after a 2,000-item run</text><rect x="178.0" y="306" width="573.4" height="20" rx="3" fill="#dc2626"/><text x="761.4194711538462" y="321" font-size="12" font-weight="600" fill="#dc2626" text-anchor="start">0.0.3: 2.35 MB</text><rect x="178.0" y="332" width="81.0" height="20" rx="3" fill="#2563eb"/><text x="268.9645432692308" y="347" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">0.1.0: 0.33 MB</text><text x="28" y="364" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">0.1.0 dropped dataclasses and typing, uses the C queue directly, and loads threading on the first run.</text></svg>