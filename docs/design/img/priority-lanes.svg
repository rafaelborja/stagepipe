<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 562" width="980" height="562" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="An item gets a priority level when it is admitted and keeps it through every stage queue. Each queue serves urgent first, then the other levels by their share, and an item that has been overtaken too often moves to the front of its level."><title>Priority lanes</title><rect width="980" height="562" rx="12" fill="#ffffff" stroke="#d1d5db"/><text xml:space="preserve" x="24" y="34" font-size="17" font-weight="700" fill="#111827" text-anchor="start">Proposal: priority levels, shares and a limit on losing your place (issue #19)</text><text xml:space="preserve" x="24" y="56" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Nothing here is built. Memory stays bounded by the window: a queue holds only items already admitted, and a level is one small integer per item.</text><text xml:space="preserve" x="24" y="88" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Admission</text><text xml:space="preserve" x="144" y="88" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">pulls the next input</text><rect x="24" y="102" width="280" height="62" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="34" y="122" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">URGENT</text><text xml:space="preserve" x="34" y="138" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">goes first, may preempt</text><rect x="154" y="114" width="34" height="28" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="171" y="133" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">u1</text><rect x="24" y="172" width="280" height="62" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="34" y="192" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">HIGH</text><text xml:space="preserve" x="34" y="208" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 6</text><rect x="154" y="184" width="34" height="28" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="171" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">h1</text><rect x="194" y="184" width="34" height="28" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="211" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">h2</text><rect x="24" y="242" width="280" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="34" y="262" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">NORMAL</text><text xml:space="preserve" x="34" y="278" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 3 (default)</text><rect x="154" y="254" width="34" height="28" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="171" y="273" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">n1</text><rect x="194" y="254" width="34" height="28" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="211" y="273" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">n2</text><rect x="234" y="254" width="34" height="28" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="251" y="273" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">n3</text><rect x="24" y="312" width="280" height="62" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="34" y="332" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">LOW</text><text xml:space="preserve" x="34" y="348" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 1</text><rect x="154" y="324" width="34" height="28" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="171" y="343" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">l1</text><rect x="194" y="324" width="34" height="28" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="211" y="343" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">l2</text><line x1="308" y1="242" x2="344" y2="242" stroke="#111827" stroke-width="2"/><text xml:space="preserve" x="326" y="236" font-size="10" font-weight="400" fill="#4b5563" text-anchor="middle">no barrier</text><text xml:space="preserve" x="350" y="88" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Stage 1 queue</text><text xml:space="preserve" x="470" y="88" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">e.g. download</text><rect x="350" y="102" width="280" height="62" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="360" y="122" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">URGENT</text><text xml:space="preserve" x="360" y="138" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">goes first, may preempt</text><rect x="480" y="114" width="34" height="28" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="497" y="133" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">u1</text><rect x="350" y="172" width="280" height="62" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="360" y="192" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">HIGH</text><text xml:space="preserve" x="360" y="208" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 6</text><rect x="480" y="184" width="34" height="28" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="497" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">h2</text><rect x="520" y="184" width="34" height="28" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="537" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">h3</text><rect x="350" y="242" width="280" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="360" y="262" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">NORMAL</text><text xml:space="preserve" x="360" y="278" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 3 (default)</text><rect x="480" y="254" width="34" height="28" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="497" y="273" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">n1</text><rect x="520" y="254" width="34" height="28" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="537" y="273" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">n2</text><rect x="350" y="312" width="280" height="62" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="360" y="332" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">LOW</text><text xml:space="preserve" x="360" y="348" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 1</text><rect x="480" y="324" width="34" height="28" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="497" y="343" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">l1</text><line x1="634" y1="242" x2="670" y2="242" stroke="#111827" stroke-width="2"/><text xml:space="preserve" x="652" y="236" font-size="10" font-weight="400" fill="#4b5563" text-anchor="middle">no barrier</text><text xml:space="preserve" x="676" y="88" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Stage 2 queue</text><text xml:space="preserve" x="796" y="88" font-size="11" font-weight="400" fill="#4b5563" text-anchor="start">e.g. ocr</text><rect x="676" y="102" width="280" height="62" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/><text xml:space="preserve" x="686" y="122" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">URGENT</text><text xml:space="preserve" x="686" y="138" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">goes first, may preempt</text><rect x="676" y="172" width="280" height="62" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="686" y="192" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">HIGH</text><text xml:space="preserve" x="686" y="208" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 6</text><rect x="806" y="184" width="34" height="28" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text xml:space="preserve" x="823" y="203" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">h1</text><rect x="676" y="242" width="280" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="686" y="262" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">NORMAL</text><text xml:space="preserve" x="686" y="278" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 3 (default)</text><rect x="806" y="254" width="34" height="28" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/><text xml:space="preserve" x="823" y="273" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">n3</text><rect x="676" y="312" width="280" height="62" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="686" y="332" font-size="12" font-weight="700" fill="#15803d" text-anchor="start">LOW</text><text xml:space="preserve" x="686" y="348" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">share 1</text><rect x="806" y="324" width="34" height="28" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/><text xml:space="preserve" x="823" y="343" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">l2</text><rect x="24" y="392" width="932" height="150" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text xml:space="preserve" x="40" y="418" font-size="14" font-weight="700" fill="#111827" text-anchor="start">How a stage picks its next item</text><text xml:space="preserve" x="40" y="442" font-size="12" font-weight="400" fill="#111827" text-anchor="start">1.  URGENT first, always (and it may preempt: see the second diagram).</text><text xml:space="preserve" x="40" y="460" font-size="12" font-weight="400" fill="#111827" text-anchor="start">2.  Then the levels take turns by share: out of every 10 picks HIGH gets 6, NORMAL 3, LOW 1, so LOW is never starved.</text><text xml:space="preserve" x="40" y="478" font-size="12" font-weight="400" fill="#111827" text-anchor="start">3.  Inside a level, first in first out. Each time an item is overtaken it counts a loss. After max_bypass losses it moves to the front of its level.</text><text xml:space="preserve" x="40" y="496" font-size="12" font-weight="400" fill="#111827" text-anchor="start">4.  The level is set once, at admission, and the item carries it through every stage. A stage starts an item the moment the previous stage hands it over.</text><text xml:space="preserve" x="40" y="514" font-size="12" font-weight="400" fill="#111827" text-anchor="start">5.  ordered=True keeps input order inside one level. Results of different levels may overtake each other.</text></svg>